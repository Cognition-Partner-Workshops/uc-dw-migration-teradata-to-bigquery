name: salesforce-source

on:
  pull_request:
    branches: [salesforce-to-aws-demo]
  push:
    branches: [salesforce-to-aws-demo]

jobs:
  validate-metadata:
    name: sf project convert (offline metadata validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesforce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salesforce/package-lock.json
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli
      - name: Convert source to Metadata API format
        run: |
          sf project convert source --output-dir /tmp/mdapi-out
          echo "Metadata types in package.xml:" && grep -c '<name>' /tmp/mdapi-out/package.xml

  lwc-tests:
    name: LWC jest + eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesforce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salesforce/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit

  inventory:
    name: Salesforce artifact inventory (tools/inventory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest tools/inventory/test_inventory.py
      - name: Inventory covers force-app and committed outputs are current
        run: python3 tools/inventory/inventory.py --check

  mapping:
    name: 1:1 mapping matrix (tools/mapping)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6,<7"
      - name: Unit tests
        run: python3 -m unittest tools/mapping/test_mapping.py
      - name: Every inventory id is mapped exactly once, targets follow conventions, mapping.md is current
        run: python3 tools/mapping/mapping.py --check

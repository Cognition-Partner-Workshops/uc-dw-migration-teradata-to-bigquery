# 1:1 mapping matrix: Salesforce (trailheadapps/dreamhouse-lwc) -> React + NestJS/Prisma + Postgres on AWS.
# Every PR that touches an artifact must keep this file current.
# target: null means "not mapped yet"; the ticket that owns the mapping is noted in `ticket`.

source:
  repo: https://github.com/trailheadapps/dreamhouse-lwc
  pinned_commit: 119e53db0138ca7be3e2d3e4e75f3447e616c535
  pinned_date: "2026-10-01"
  import_method: git subtree --squash (prefix salesforce/)
  sfdx_project: salesforce/sfdx-project.json
  source_api_version: "64.0"
  validation:
    offline: sf project convert source  # 19 metadata types in package.xml
    lwc_tests: npm run test:unit         # 17 suites / 83 tests
    live: sf project deploy validate --source-dir force-app --test-level RunLocalTests

target:
  api: app/api (TypeScript, NestJS + Prisma, PostgreSQL) on ECS Fargate + ALB
  web: app/web (React)
  infra: infra/ (Terraform, AWS 599083837640, us-east-1)
  parity: tests/parity/ (live against both apps)


# 1:1 mapping matrix: Salesforce (trailheadapps/dreamhouse-lwc) -> React + NestJS/Prisma + Postgres on AWS.
# Every PR that touches an artifact must keep this file current.
# target: null means "not mapped yet"; the ticket that owns the mapping is noted in `ticket`.

source:
  repo: https://github.com/trailheadapps/dreamhouse-lwc
  pinned_commit: 119e53db0138ca7be3e2d3e4e75f3447e616c535
  pinned_date: "2026-10-01"
  import_method: git subtree --squash (prefix salesforce/)
  sfdx_project: salesforce/sfdx-project.json
  source_api_version: "64.0"
  validation:
    offline: sf project convert source  # 19 metadata types in package.xml
    lwc_tests: npm run test:unit         # 17 suites / 83 tests
    live: sf project deploy validate --source-dir force-app --test-level RunLocalTests

target:
  api: app/api (TypeScript, NestJS + Prisma, PostgreSQL) on ECS Fargate + ALB
  api_scaffold:                      # UNT3-6 — Node 20, NestJS 11, Prisma 7, Vitest, pino, zod config (+ Secrets Manager)
    readme: app/api/README.md        # includes the Apex-concept -> service concept map
    openapi: app/api/openapi/openapi.json   # exported from the controllers; served live at /openapi.json (+ /docs)
    health: [GET /health, GET /health/ready]
    ci: .github/workflows/api.yml
    modules:                         # one Nest module per Salesforce object / Apex domain; stubs answer 501 until ported
      properties:  {path: app/api/src/modules/properties,  sources: [Property__c, PropertyController, TestPropertyController, PagedResult]}
      brokers:     {path: app/api/src/modules/brokers,     sources: [Broker__c]}
      contacts:    {path: app/api/src/modules/contacts,    sources: [Contact]}
      files:       {path: app/api/src/modules/files,       sources: [FileUtilities, FileUtilitiesTest, ContentVersion, ContentDocumentLink]}
      geocoding:   {path: app/api/src/modules/geocoding,   sources: [GeocodingService, GeocodingServiceTest, nominatim_openstreetmap]}
      sample-data: {path: app/api/src/modules/sample-data, sources: [SampleDataController, TestSampleDataController, sample_data_brokers, sample_data_properties, sample_data_contacts]}
  web: app/web (React)
  infra: infra/ (Terraform, AWS 599083837640, us-east-1)
  parity: tests/parity/ (live against both apps)

artifacts:
  objects:
    - name: Property__c
      path: salesforce/force-app/main/default/objects/Property__c
      fields: [Address__c, Assessed_Value__c, Baths__c, Beds__c, Broker__c, City__c, Date_Agreement__c, Date_Closed__c, Date_Contracted__c, Date_Listed__c, Date_Pre_Market__c, Days_On_Market__c, Description__c, Location__c, Picture_IMG__c, Picture__c, Price_Sold__c, Price__c, Record_Link__c, State__c, Status__c, Tags__c, Thumbnail_IMG__c, Thumbnail__c, Zip__c]
      target: null   # Postgres table + Prisma model (app/api/prisma/schema.prisma); API module app/api/src/modules/properties
      ticket: UNT3-11
    - name: Broker__c
      path: salesforce/force-app/main/default/objects/Broker__c
      fields: [Broker_Id__c, Email__c, Mobile_Phone__c, Phone__c, Picture_IMG__c, Picture__c, Title__c]
      target: null   # Prisma model; API module app/api/src/modules/brokers
      ticket: UNT3-11
    - name: Contact            # standard object; only sample data is shipped
      path: salesforce/data/contacts-data.json
      target: null   # Prisma model; API module app/api/src/modules/contacts
      ticket: UNT3-11

  apex:
    - name: PropertyController
      path: salesforce/force-app/main/default/classes/PropertyController.cls
      tests: [TestPropertyController]
      target: app/api/src/modules/properties  # GET /properties (getPagedPropertyList), GET /properties/{id}/pictures (getPictures); stub 501 until UNT3-16
      ticket: UNT3-4
    - name: GeocodingService
